<div class="shell"><aside class="sidebar"><div class="brand"><h1>ICE <b>NUMBERS</b></h1><div class="sub tiny">16-team hockey history simulator</div></div><nav id="nav"></nav><div class="sidefoot">Offline-capable • Stores history locally<br>V1.2 — player scoring & playoff controls</div></aside><main class="content"><div class="topline"><div><h1 id="title">League Dashboard</h1><p class="sub" id="subtitle">A league defined by luck, dynasties and droughts.</p></div><span class="pill" id="season-label">Season 1</span></div><div id="banner"></div><div id="app"></div></main></div>

const DEFAULTS={goalExponent:1.35,assistExponent:1.2,unnamedWeight:8,unassistedPct:20,oneAssistPct:45,gamesPerTeam:30,rollMax:12,maxRoster:3,maxBonus:8,careerLength:5,playoffTeams:8,seriesBestOf:7,firstRoundBonuses:[3,2,1,0],semifinalBonuses:[2,1],finalBonus:1,normalWeights:[40,27,16,9,4,2,1.5,.5],draftWeights:[13,18,20,18,13,9,6,3],startYear:1};
const TAB_NAMES={dashboard:'Dashboard',standings:'Standings',playoffs:'Playoff Bracket',alltime:'All-Time Records',history:'Season History',teams:'Team Records',players:'Player History',customize:'Team Customization',faq:'FAQ',settings:'Settings'};
let db,state,view='dashboard',sortBy='regW',sortDescending=true,selectedSeason=null,selectedTeam=0,playerSort='bonus',busy=false,cancelRun=false,progressText='',progressPercent=0,notice='';
const $=id=>document.getElementById(id),fmt=x=>Number(x||0).toLocaleString('en-CA'),pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
function createTeam(name,id){return {id,name,logo:null,roster:[],regW:0,regL:0,regOTL:0,regPoints:0,regCoinW:0,regCoinL:0,playoffW:0,playoffL:0,playoffCoinW:0,playoffCoinL:0,playoffSeriesW:0,playoffSeriesL:0,playoffApps:0,missedPlayoffs:0,finals:0,titles:0,lastPlaces:0,currentPlayoffStreak:0,bestPlayoffStreak:0,currentMissStreak:0,bestMissStreak:0,currentTitleStreak:0,bestTitleStreak:0,titleDrought:0,longestTitleDrought:0,currentFirstStreak:0,bestFirstStreak:0,currentRegWinStreak:0,currentRegLossStreak:0,bestRegWinStreak:0,bestRegLossStreak:0,pointsFor:0,pointsAgainst:0,firstSeasonTitle:0}};
function initialState(){const seed=(Math.floor(Math.random()*0xffffffff)>>>0);return {version:2,season:0,activeSeason:null,teams:TEAM_NAMES.map(createTeam),nextPlayerId:1,pendingDraftTeam:null,settings:clone(DEFAULTS),rngState:seed||123456789,initialSeed:seed||123456789,totalGames:0,totalCoin:0,notes:[]}};
function random(){let x=state.rngState=(state.rngState+0x6D2B79F5)>>>0;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return ((x^(x>>>14))>>>0)/4294967296}
function randint(a,b){return a+Math.floor(random()*(b-a+1))}
function weighted(weights){let total=weights.reduce((a,b)=>a+b,0),r=random()*total;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<0)return i+1}return weights.length}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('IceNumbersV1',1);req.onupgradeneeded=()=>{let d=req.result;d.createObjectStore('meta',{keyPath:'key'});d.createObjectStore('seasons',{keyPath:'season'});let gs=d.createObjectStore('games',{keyPath:'id'});gs.createIndex('bySeason','season');gs.createIndex('byTeam','teamIds',{multiEntry:true});let p=d.createObjectStore('players',{keyPath:'id'});p.createIndex('byTeam','teamId');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function get(store,key){return new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getAll(store){return new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getIndexAll(store,index,key){return new Promise((resolve,reject)=>{let req=db.transaction(store,'readonly').objectStore(store).index(index).getAll(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function commitSeason(season,games,players){return new Promise((resolve,reject)=>{let tx=db.transaction(['meta','seasons','games','players'],'readwrite');tx.objectStore('meta').put({key:'main',value:clone(state)});tx.objectStore('seasons').put(season);for(const g of games)tx.objectStore('games').put(g);for(const p of players)tx.objectStore('players').put(p);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function commitState(){return new Promise((resolve,reject)=>{let tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({key:'main',value:clone(state)});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function newPlayer(teamId,origin,season){let s=state.settings;return {id:state.nextPlayerId++,teamId,name:FIRST[randint(0,FIRST.length-1)]+' '+LAST[randint(0,LAST.length-1)],bonus:weighted(origin==='draft'?s.draftWeights:s.normalWeights),startingYear:origin==='draft'?1:randint(1,s.careerLength),year:0,origin,joinSeason:season,retireSeason:null,seasons:0,regGames:0,regWins:0,regLosses:0,regOTL:0,regGoals:0,regAssists:0,playoffGoals:0,playoffAssists:0,playoffGames:0,playoffWins:0,playoffLosses:0,titles:0,history:[]}}
function makeNewPlayer(teamId,origin,season){let p=newPlayer(teamId,origin,season);p.year=p.startingYear;return p}
function bonusOf(team){return Math.min(state.settings.maxBonus,team.roster.reduce((a,p)=>a+p.bonus,0))}
// Ice Numbers 1.2: one source of truth for rolls, scores and scoring plays.
function clamp(x,lo,hi){return Math.max(lo,Math.min(hi,x))}
function ensurePlayer(p){for(const key of ['regGoals','regAssists','regOTL','playoffGoals','playoffAssists','regGames','regWins','regLosses','playoffGames','playoffWins','playoffLosses','seasons','titles'])p[key]??=0;return p}
function pickWeighted(items){let sum=items.reduce((z,i)=>z+i.weight,0),v=random()*sum;for(const item of items){v-=item.weight;if(v<0)return item.id}return items[items.length-1].id}
function scoringWeight(p,assist=false){return Math.pow(p.bonus+1,assist?(state.settings.assistExponent??1.2):(state.settings.goalExponent??1.35))}
function scoringPlay(team,stage,game,changed){
 const players=team.roster;
 const scorerPool=[{id:null,weight:state.settings.unnamedWeight??8},...players.map(p=>({id:p.id,weight:scoringWeight(p)}))];
 const scorerId=pickWeighted(scorerPool);
 let assisterIds=[],anonymousAssists=0;
 const unassisted=state.settings.unassistedPct??20,one=state.settings.oneAssistPct??45;
 const v=random()*100,numAssists=v<unassisted?0:v<unassisted+one?1:2;
 const candidates=players.filter(p=>p.id!==scorerId).map(p=>({id:p.id,weight:scoringWeight(p,true)}));
 for(let i=0;i<numAssists;i++){
   let id=pickWeighted([{id:null,weight:state.settings.unnamedWeight??8},...candidates]);
   if(id!==null){assisterIds.push(id);candidates.splice(candidates.findIndex(c=>c.id===id),1)}else anonymousAssists++
 }
 if(scorerId!==null){let p=ensurePlayer(players.find(p=>p.id===scorerId));p[stage==='regular'?'regGoals':'playoffGoals']++;changed?.set(p.id,p)}
 for(const id of assisterIds){let p=ensurePlayer(players.find(p=>p.id===id));p[stage==='regular'?'regAssists':'playoffAssists']++;changed?.set(p.id,p)}
 return {teamId:team.id,scorerId,scorerName:scorerId===null?'Unnamed skater':players.find(p=>p.id===scorerId)?.name,assistIds:assisterIds,assistNames:assisterIds.map(id=>players.find(p=>p.id===id)?.name),anonymousAssists,assistsCount:numAssists};
}
function generateScore(a,b,g,changed){
 const lower=Math.min(g.rollA,g.rollB);
 const losingGoals=clamp(Math.round(1+lower*.19+(random()-.5)*2.8),0,6);
 let margin;
 if(g.coin)margin=1;
 else{const difference=Math.abs(g.totalA-g.totalB);margin=clamp(Math.round(difference/3.8+(random()-.5)*1.7),1,7)}
 const winningGoals=clamp(losingGoals+margin,1,11);
 g.scoreA=g.winnerId===a.id?winningGoals:losingGoals;
 g.scoreB=g.winnerId===b.id?winningGoals:losingGoals;
 g.ot=g.coin;
 g.goalEvents=[];
 // In an overtime game, the last goal is credited to the winning side.
 const goals=[...Array(g.scoreA)].map(()=>a).concat([...Array(g.scoreB)].map(()=>b));
 if(g.coin){let ix=goals.findIndex(t=>t.id===g.winnerId);if(ix>=0)goals.push(goals.splice(ix,1)[0])}
 for(const team of goals)g.goalEvents.push(scoringPlay(team,g.stage,g,changed));
}
function playGame(a,b,bonusA,bonusB,season,stage,round,seriesNo,gameNo,gs,changed){
 const rollA=randint(0,state.settings.rollMax),rollB=randint(0,state.settings.rollMax);
 const totalA=rollA+bonusA,totalB=rollB+bonusB,coin=rollA===rollB||totalA===totalB;
 const winner=coin?(random()<.5?a:b):(totalA>totalB?a:b),loser=winner===a?b:a;
 const g={id:`S${season}-${stage}-${String(state.totalGames).padStart(8,'0')}`,season,stage,round,seriesNo,gameNo,teamIds:[a.id,b.id],aId:a.id,bId:b.id,rollA,rollB,bonusA,bonusB,totalA,totalB,coin,coinReason:rollA===rollB?'original-roll':(coin?'adjusted-total':null),winnerId:winner.id,loserId:loser.id};
 generateScore(a,b,g,changed);gs.push(g);state.totalGames++;if(coin)state.totalCoin++;
 if(stage==='regular'){
   winner.regW++;loser.regPoints+=coin?1:0;loser.regOTL=(loser.regOTL||0)+(coin?1:0);if(!coin)loser.regL++;
   winner.regPoints+=2;
   if(coin){winner.regCoinW++;loser.regCoinL++}
   a.pointsFor+=g.scoreA;a.pointsAgainst+=g.scoreB;b.pointsFor+=g.scoreB;b.pointsAgainst+=g.scoreA;
   winner.currentRegWinStreak++;winner.currentRegLossStreak=0;
   loser.currentRegLossStreak++;loser.currentRegWinStreak=0;
   winner.bestRegWinStreak=Math.max(winner.bestRegWinStreak,winner.currentRegWinStreak);
   loser.bestRegLossStreak=Math.max(loser.bestRegLossStreak,loser.currentRegLossStreak);
 }else{winner.playoffW++;loser.playoffL++;if(coin){winner.playoffCoinW++;loser.playoffCoinL++}}
 for(const t of [a,b])for(const player of t.roster){const p=ensurePlayer(player);const prefix=stage==='regular'?'reg':'playoff';p[prefix+'Games']++;if(stage==='regular'&&winner.id!==t.id&&coin)p.regOTL++;else p[prefix+(winner.id===t.id?'Wins':'Losses')]++;changed?.set(p.id,p)}
 return g;
}
function roundRobin(ids){let arr=ids.slice(),n=arr.length,rounds=[];for(let r=0;r<n-1;r++){let pairs=[];for(let i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);rounds.push(pairs);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}return rounds}
function standingsSort(a,b){return b.points-a.points||b.w-a.w||b.diff-a.diff||a.tieBreaker-b.tieBreaker}
function snapshotRow(team,seasonStats,seed){return {id:team.id,name:team.name,seed,played:seasonStats.games,w:seasonStats.w,l:seasonStats.l,otl:seasonStats.otl,points:seasonStats.points,coinW:seasonStats.coinW,coinL:seasonStats.coinL,gf:seasonStats.gf,ga:seasonStats.ga,diff:seasonStats.diff,bonus:seasonStats.bonus,tieBreaker:seasonStats.tieBreaker}}
function makeMatch(a,b,bonusA,bonusB){return {aId:a,bId:b,bonusA,bonusB,winsA:0,winsB:0,winnerId:null,gameIds:[]}}
function firstRound(season){const s=season.settings,rows=season.standings,pairs=[[1,8],[4,5],[2,7],[3,6]];return pairs.map(([a,b])=>makeMatch(rows[a-1].id,rows[b-1].id,s.firstRoundBonuses[a-1],0))}
function nextRound(season){
 const round=season.rounds.length,prev=season.rounds[round-1];if(round===1){
  const pairs=[[prev[0].winnerId,prev[1].winnerId],[prev[2].winnerId,prev[3].winnerId]],seed=id=>season.seedById[id],best=Math.min(...pairs.flat().map(seed));

async function changeTeamName(id){

async function resizeTeamLogo(file){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a PNG, JPG or WebP image.');
 if(file.size>5*1024*1024)throw Error('Logo must be smaller than 5 MB.');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  if(!img.naturalWidth||!img.naturalHeight)throw Error('Could not read this image.');
  const canvas=document.createElement('canvas');canvas.width=160;canvas.height=160;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image conversion is not supported in this browser.');
  ctx.clearRect(0,0,160,160);const scale=Math.min(160/img.naturalWidth,160/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
  ctx.drawImage(img,(160-w)/2,(160-h)/2,w,h);
  let data=canvas.toDataURL('image/png');
  if(data.length>250000)data=canvas.toDataURL('image/webp',.85);
  if(data.length>450000)throw Error('Logo is too complex to save. Try a simpler image.');
  return data;
 }finally{URL.revokeObjectURL(url)}
}

  try{await commitState()}catch(err){t.logo=old;throw err}

}

async function saveSettings(){if(state.activeSeason){setBanner('Finish the current playoffs before editing rules.',true);return}let s=clone(state.settings);for(let k of ['gamesPerTeam','rollMax','maxRoster','maxBonus','careerLength','finalBonus','unnamedWeight','unassistedPct','oneAssistPct']){let e=$('cfg-'+k);if(e){let n=Number(e.value);if(!Number.isInteger(n)||n<Number(e.min)||n>Number(e.max)){setBanner('Invalid setting for '+k,true);return}s[k]=n}}for(let k of ['goalExponent','assistExponent']){let e=$('cfg-'+k),v=Number(e.value);if(!Number.isFinite(v)||v<0.2||v>3){setBanner('Invalid scoring weight '+k,true);return}s[k]=v}if(s.unassistedPct+s.oneAssistPct>100){setBanner('Unassisted and one-assist chances cannot total more than 100%.',true);return}for(let k of ['normalWeights','draftWeights']){let es=[...document.querySelectorAll(`[data-weight="${k}"]`)];s[k]=es.map(e=>Number(e.value));if(s[k].some(x=>!Number.isFinite(x)||x<0)||Math.abs(s[k].reduce((a,b)=>a+b,0)-100)>.001){setBanner(k+' weights must total exactly 100%.',true);return}}for(let k of ['firstRoundBonuses','semifinalBonuses']){s[k]=[...document.querySelectorAll(`[data-seed="${k}"]`)].map(e=>Number(e.value));if(s[k].some(x=>!Number.isInteger(x)||x<0||x>25)){setBanner('Seeding bonuses must be whole numbers 0–25.',true);return}}if(s.maxRoster<Math.max(...state.teams.map(t=>t.roster.length))){setBanner('Current players exceed the new roster cap.',true);return}state.settings=s;await commitState();setBanner('Settings saved for future seasons.');settings()}
async function runN(n){if(busy)return;if(n>=1000&&!confirm('Simulate 1,000 seasons? This stores every game and could take a little while.'))return;busy=true;cancelRun=false;let done=0;try{await render();for(let i=0;i<n;i++){let prev=clone(state);let sim=simulateSeason();try{await commitSeason(sim.result,sim.games,sim.players)}catch(e){state=prev;throw e}done++;progressPercent=100*done/n;progressText=`Saved ${fmt(done)} / ${fmt(n)} seasons. Current: Season ${fmt(state.season)}`;if(i%5===0||i===n-1){if(view==='dashboard'){let bar=document.querySelector('.progress>div');if(bar)bar.style.width=progressPercent+'%';let label=document.querySelector('.progress+.sub');if(label)label.textContent=progressText}await new Promise(r=>setTimeout(r,0))}if(cancelRun)break}selectedSeason=state.season;setBanner(`Simulated and saved ${fmt(done)} season${done===1?'':'s'}. Full game and player histories have been archived.`)}catch(err){console.error(err);setBanner('Simulation stopped: '+err.message,true)}finally{busy=false;progressPercent=0;progressText='';await render()}}
async function exportBackup(){let exp={format:'ice-numbers-v1',savedAt:new Date().toISOString(),meta:state,seasons:await getAll('seasons'),games:await getAll('games'),players:await getAll('players')};let blob=new Blob([JSON.stringify(exp)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ice-numbers-season-${state.season}-backup.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);setBanner('Backup downloaded. Keep the JSON file somewhere safe.')}
function writeChunk(store,items){return new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite'),os=tx.objectStore(store);for(let item of items)os.put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}

async function importBackup(file){if(!confirm('Replace this entire league with the imported backup? Export your current league first if you want to keep it.'))return;busy=true;try{let obj=JSON.parse(await file.text());if(obj.format!=='ice-numbers-v1'||!obj.meta?.teams||!Array.isArray(obj.games)||!Array.isArray(obj.seasons)||!Array.isArray(obj.players))throw Error('Not a valid Ice Numbers V1 backup.');await clearAll();for(let store of ['seasons','games','players']){for(let i=0;i<obj[store].length;i+=500)await writeChunk(store,obj[store].slice(i,i+500))}state=obj.meta;await commitState();selectedSeason=state.season;view='dashboard';setBanner('Imported the league backup successfully.')}catch(err){console.error(err);setBanner('Import failed: '+err.message,true)}finally{busy=false;await render()}}
async function resetAll(){if(!confirm('Delete this league and all its historical records? Download a backup first if you want to keep it.'))return;await clearAll();state=initialState();await commitState();selectedSeason=null;view='dashboard';setBanner('New universe created. Your previous league was deleted.');await render()}
async function render(){renderNav();$('banner').innerHTML=notice?`<div class="notice">${esc(notice)}</div>`:'';if(view==='dashboard')await dashboard();else if(view==='standings')await standings();else if(view==='playoffs')playoffs();else if(view==='faq')faq();else if(view==='alltime')alltime();else if(view==='history')await history();else if(view==='teams')teams();else if(view==='players')await players();else if(view==='customize')customize();else if(view==='settings')settings();$('season-label').textContent=state.activeSeason?'Playoffs: Season '+state.activeSeason.season:'Next: Season '+fmt(state.season+1)}
function handleClick(e){const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort;if(sortBy===k)sortDescending=!sortDescending;else {sortBy=k;sortDescending=k!=='name'}render();return}let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.regular!==undefined){runRegularSeason();return}if(btn.dataset.nextPlayoff){advancePlayoffs(btn.dataset.nextPlayoff);return}if(btn.dataset.liveSeries){const [round,i]=btn.dataset.liveSeries.split('-').map(Number);const div=$(`live-games-${round}-${i}`);if(!div)return;div.classList.toggle('hide');if(!div.classList.contains('hide')){const match=state.activeSeason?.rounds[round]?.[i];if(match)getIndexAll('games','bySeason',state.activeSeason.season).then(gs=>{let ids=new Set(match.gameIds);div.innerHTML=gameTable(gs.filter(g=>ids.has(g.id)))})}return}if(btn.dataset.saveTeam!==undefined){changeTeamName(Number(btn.dataset.saveTeam));return}if(btn.dataset.uploadLogo!==undefined){$('logo-input-'+btn.dataset.uploadLogo)?.click();return}if(btn.dataset.removeLogo!==undefined){removeTeamLogo(Number(btn.dataset.removeLogo));return}let nav=btn.dataset.nav;if(nav){view=nav;notice='';render();return}if(btn.dataset.team!==undefined){selectedTeam=Number(btn.dataset.team);view='teams';render();return}if(btn.dataset.run){runN(Number(btn.dataset.run));return}if(btn.id==='stopbtn'){cancelRun=true;btn.disabled=true;btn.textContent='Stopping after this season…';return}if(btn.dataset.year){selectedSeason=Number(btn.dataset.year);view='history';render();return}if(btn.dataset.series){let [r,i]=btn.dataset.series.split('-').map(Number),target=$(`series-games-${r}-${i}`);if(!target)return;target.classList.toggle('hide');if(!target.classList.contains('hide')){get('seasons',selectedSeason).then(s=>getIndexAll('games','bySeason',selectedSeason).then(gs=>{let ids=new Set(s.rounds[r][i].gameIds),matches=gs.filter(g=>ids.has(g.id));target.innerHTML=gameTable(matches)}));}return}if(btn.id==='save-settings'){saveSettings();return}if(btn.id==='export'){exportBackup().catch(err=>setBanner('Export failed: '+err.message,true));return}if(btn.id==='import'){$('backup-input').click();return}if(btn.id==='reset'){resetAll();return}}
async function boot(){try{db=await openDB();let saved=await get('meta','main');state=saved?.value||initialState();state.settings={...clone(DEFAULTS),...state.settings};for(const t of state.teams){if(t.regOTL===undefined){t.regOTL=t.regCoinL||0;t.regL=Math.max(0,t.regL-(t.regCoinL||0))}}state.version=2;state.activeSeason??=null;if(!saved)await commitState();$('nav').addEventListener('click',handleClick);$('app').addEventListener('click',handleClick);$('app').addEventListener('change',e=>{if(e.target.dataset.logoInput!==undefined){const f=e.target.files?.[0];if(f)changeTeamLogo(Number(e.target.dataset.logoInput),f);e.target.value='';return}if(e.target.id==='season-select'){selectedSeason=Number(e.target.value);render()}if(e.target.id==='team-select'){selectedTeam=Number(e.target.value);render()}if(e.target.id==='player-sort'){playerSort=e.target.value;render()}});$('app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('th[data-sort]')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.dataset.teamName!==undefined){e.preventDefault();changeTeamName(Number(e.target.dataset.teamName))}});$('backup-input').addEventListener('change',e=>{let f=e.target.files[0];if(f)importBackup(f);e.target.value=''});await render()}catch(err){console.error(err);$('app').innerHTML=`<div class="notice warn">Unable to open local browser storage: ${esc(err.message)}. Try Chrome or Edge in a normal window, rather than private mode.</div>`}}
boot();
</script></body></html>

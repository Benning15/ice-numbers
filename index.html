function commitSeason(season,games,players){return new Promise((resolve,reject)=>{let tx=db.transaction(['meta','seasons','games','players'],'readwrite');tx.objectStore('meta').put({key:'main',value:clone(state)});tx.objectStore('seasons').put(season);for(const g of games)tx.objectStore('games').put(g);for(const p of players)tx.objectStore('players').put(p);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function commitState(){return new Promise((resolve,reject)=>{let tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({key:'main',value:clone(state)});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function newPlayer(teamId,origin,season){let s=state.settings;return {id:state.nextPlayerId++,teamId,name:FIRST[randint(0,FIRST.length-1)]+' '+LAST[randint(0,LAST.length-1)],bonus:weighted(origin==='draft'?s.draftWeights:s.normalWeights),startingYear:origin==='draft'?1:randint(1,s.careerLength),year:0,origin,joinSeason:season,retireSeason:null,seasons:0,regGames:0,regWins:0,regLosses:0,playoffGames:0,playoffWins:0,playoffLosses:0,titles:0,history:[]}}

function bonusOf(team){return Math.min(state.settings.maxBonus,team.roster.reduce((a,p)=>a+p.bonus,0))}

function roundRobin(ids){let arr=ids.slice(),n=arr.length,rounds=[];for(let r=0;r<n-1;r++){let pairs=[];for(let i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);rounds.push(pairs);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}return rounds}

function snapshotRow(team,seasonStats,seed){return {id:team.id,name:team.name,seed,played:seasonStats.games,w:seasonStats.w,l:seasonStats.l,points:seasonStats.points,coinW:seasonStats.coinW,coinL:seasonStats.coinL,diff:seasonStats.diff,bonus:seasonStats.bonus,tieBreaker:seasonStats.tieBreaker}}
function series(a,b,bonusA,bonusB,season,round,num,gs){let wa=0,wb=0,need=Math.floor(state.settings.seriesBestOf/2)+1;let gameIds=[];while(wa<need&&wb<need){let g=playGame(a,b,bonusA,bonusB,season,'playoff',round,num,gameIds.length+1,gs);gameIds.push(g.id);g.winnerId===a.id?wa++:wb++}let win=wa>wb?a:b,lose=win===a?b:a;win.playoffSeriesW++;lose.playoffSeriesL++;return {aId:a.id,bId:b.id,bonusA,bonusB,winsA:wa,winsB:wb,winnerId:win.id,gameIds}}
function simulateSeason(){let s=state.settings,year=state.season+1,gs=[],changed=new Map(),events=[],rosterStart={};

let rows=state.teams.map((t,i)=>{let pre=before[i],now={w:t.regW-pre.w,l:t.regL-pre.l,points:t.regPoints-pre.points,coinW:t.regCoinW-pre.coinW,coinL:t.regCoinL-pre.coinL,diff:(t.pointsFor-t.pointsAgainst)-pre.diff,games:s.gamesPerTeam,bonus:baseBonus[i],tieBreaker:random()};return snapshotRow(t,now,0)}).sort(standingsSort);rows.forEach((r,i)=>r.seed=i+1);const seedById=Object.fromEntries(rows.map(r=>[r.id,r.seed]));
const playoffIds=new Set(rows.slice(0,s.playoffTeams).map(r=>r.id));let last=rows[rows.length-1];state.pendingDraftTeam=last.id;let brackets=[];let qmatchups=[[1,8],[4,5],[2,7],[3,6]];let q=qmatchups.map(([i,j],k)=>{let a=state.teams[rows[i-1].id],b=state.teams[rows[j-1].id];return series(a,b,s.firstRoundBonuses[Math.min(i,j)===1?0:Math.min(i,j)===2?1:Math.min(i,j)===3?2:3],0,year,1,k+1,gs)});brackets.push(q);

}
function settings(){titlebar('League Settings','Adjust future seasons without changing the past.');let s=state.settings;$('app').innerHTML=`<div class="notice warn">Settings changes affect future seasons only. Previous season results and rule snapshots remain untouched. Some core league rules are fixed in V1.1. Team names and logos are managed under Team Customization.</div><div class="formgrid"><div class="panel"><h2>Simulation</h2>${sel('gamesPerTeam','Games per team',[[30,'30'],[60,'60'],[90,'90']])}${number('rollMax','Highest random roll',4,100)}${number('maxRoster','Maximum players per team',1,10)}${number('maxBonus','Combined regular-season bonus cap',0,30)}${number('careerLength','Maximum career length (years)',1,15)}<h3 class="mutedline">Player odds</h3><p class="help">Percentage weights for a generated +1 through +8 player. Each set must total 100.</p>${['normalWeights','draftWeights'].map(k=>`<div class="mutedline"><b>${k==='normalWeights'?'Normal spawn':'Last-place draft'}</b>${s[k].map((w,i)=>`<div class="control"><label>+${i+1} chance (%)</label><input type="number" step="0.1" min="0" max="100" data-weight="${k}" data-index="${i}" value="${w}"></div>`).join('')}</div>`).join('')}</div><div class="panel"><h2>Playoffs</h2><p class="help">Player bonuses do not count in playoffs. Seeding bonuses are independent.</p>${number('playoffTeams','Teams in playoffs',8,8,true)}${sel('seriesBestOf','Series length',[[7,'Best of 7']])}${s.firstRoundBonuses.map((_,i)=>`<div class="control"><label>Round 1: seed ${i+1} bonus</label><input type="number" min="0" max="25" data-seed="firstRoundBonuses" data-index="${i}" value="${s.firstRoundBonuses[i]}"></div>`).join('')}${s.semifinalBonuses.map((_,i)=>`<div class="control"><label>Semifinals: ${i===0?'highest remaining seed':'other higher seed'}</label><input type="number" min="0" max="25" data-seed="semifinalBonuses" data-index="${i}" value="${s.semifinalBonuses[i]}"></div>`).join('')}${number('finalBonus','Finals higher-seed bonus',0,25)}<button class="primary" id="save-settings">Save future-season settings</button><p class="help" style="margin-top:10px">The selected game count must be a multiple of 15 for an even schedule.</p></div></div><div class="panel"><h2>Save, restore and backup</h2><p class="sub">This league lives in your browser's local IndexedDB storage. Make backups, especially before clearing browser data or moving computers.</p><div class="buttonrow"><button id="export">Download complete league backup (.json)</button><button id="import">Import saved backup</button><button id="reset" class="danger">Start a new universe</button></div><p class="help">Your starting random seed: ${state.initialSeed}. Backup includes every game roll, every coin flip, every player, and every season.</p></div>`}
function number(key,label,min,max,disabled=false){return `<div class="control"><label for="cfg-${key}">${label}</label><input id="cfg-${key}" type="number" min="${min}" max="${max}" step="1" value="${state.settings[key]}" ${disabled?'disabled':''}></div>`}
function sel(key,label,opts){return `<div class="control"><label for="cfg-${key}">${label}</label><select id="cfg-${key}" class="select">${opts.map(([v,l])=>`<option value="${v}" ${state.settings[key]===v?'selected':''}>${l}</option>`).join('')}</select></div>`}
async function saveSettings(){let s=clone(state.settings);for(let k of ['gamesPerTeam','rollMax','maxRoster','maxBonus','careerLength','finalBonus']){let e=$('cfg-'+k);if(e){let n=Number(e.value);if(!Number.isInteger(n)||n<Number(e.min)||n>Number(e.max)){setBanner('Invalid setting for '+k,true);return}s[k]=n}}for(let k of ['normalWeights','draftWeights']){let es=[...document.querySelectorAll(`[data-weight="${k}"]`)];s[k]=es.map(e=>Number(e.value));if(s[k].some(x=>!Number.isFinite(x)||x<0)||Math.abs(s[k].reduce((a,b)=>a+b,0)-100)>.001){setBanner((k==='normalWeights'?'Normal spawn':'Draft')+' weights must total exactly 100%.',true);return}}for(let k of ['firstRoundBonuses','semifinalBonuses']){s[k]=[...document.querySelectorAll(`[data-seed="${k}"]`)].map(e=>Number(e.value));if(s[k].some(x=>!Number.isInteger(x)||x<0||x>25)){setBanner('Seeding bonuses must be whole numbers from 0 to 25.',true);return}}if(s.maxRoster<Math.max(...state.teams.map(t=>t.roster.length))){setBanner('Cannot lower the roster limit below an existing team’s roster size.',true);return}state.settings=s;await commitState();setBanner('Settings saved. New rules apply starting next season.');settings()}
async function runN(n){if(busy)return;if(n>=1000&&!confirm('Simulate 1,000 seasons? This stores every game and could take a little while.'))return;busy=true;cancelRun=false;let done=0;try{await render();for(let i=0;i<n;i++){let prev=clone(state);let sim=simulateSeason();try{await commitSeason(sim.result,sim.games,sim.players)}catch(e){state=prev;throw e}done++;progressPercent=100*done/n;progressText=`Saved ${fmt(done)} / ${fmt(n)} seasons. Current: Season ${fmt(state.season)}`;if(i%5===0||i===n-1){if(view==='dashboard'){let bar=document.querySelector('.progress>div');if(bar)bar.style.width=progressPercent+'%';let label=document.querySelector('.progress+.sub');if(label)label.textContent=progressText}await new Promise(r=>setTimeout(r,0))}if(cancelRun)break}selectedSeason=state.season;setBanner(`Simulated and saved ${fmt(done)} season${done===1?'':'s'}. Full game and player histories have been archived.`)}catch(err){console.error(err);setBanner('Simulation stopped: '+err.message,true)}finally{busy=false;progressPercent=0;progressText='';await render()}}
async function exportBackup(){let exp={format:'ice-numbers-v1',savedAt:new Date().toISOString(),meta:state,seasons:await getAll('seasons'),games:await getAll('games'),players:await getAll('players')};let blob=new Blob([JSON.stringify(exp)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ice-numbers-season-${state.season}-backup.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);setBanner('Backup downloaded. Keep the JSON file somewhere safe.')}
function writeChunk(store,items){return new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite'),os=tx.objectStore(store);for(let item of items)os.put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function clearAll(){await Promise.all(['meta','seasons','games','players'].map(store=>new Promise((resolve,reject)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})))}
async function importBackup(file){if(!confirm('Replace this entire league with the imported backup? Export your current league first if you want to keep it.'))return;busy=true;try{let obj=JSON.parse(await file.text());if(obj.format!=='ice-numbers-v1'||!obj.meta?.teams||!Array.isArray(obj.games)||!Array.isArray(obj.seasons)||!Array.isArray(obj.players))throw Error('Not a valid Ice Numbers V1 backup.');await clearAll();for(let store of ['seasons','games','players']){for(let i=0;i<obj[store].length;i+=500)await writeChunk(store,obj[store].slice(i,i+500))}state=obj.meta;await commitState();selectedSeason=state.season;view='dashboard';setBanner('Imported the league backup successfully.')}catch(err){console.error(err);setBanner('Import failed: '+err.message,true)}finally{busy=false;await render()}}
async function resetAll(){if(!confirm('Delete this league and all its historical records? Download a backup first if you want to keep it.'))return;await clearAll();state=initialState();await commitState();selectedSeason=null;view='dashboard';setBanner('New universe created. Your previous league was deleted.');await render()}
async function render(){renderNav();$('banner').innerHTML=notice?`<div class="notice">${esc(notice)}</div>`:'';if(view==='dashboard')await dashboard();else if(view==='standings')await standings();else if(view==='alltime')alltime();else if(view==='history')await history();else if(view==='teams')teams();else if(view==='players')await players();else if(view==='customize')customize();else if(view==='settings')settings();$('season-label').textContent='Next: Season '+fmt(state.season+1)}
function handleClick(e){const sortHeader=e.target.closest('th[data-sort]');if(sortHeader){const key=sortHeader.dataset.sort;if(sortBy===key)sortDescending=!sortDescending;else{sortBy=key;sortDescending=key!=='name'}render();return}let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.saveTeam!==undefined){changeTeamName(Number(btn.dataset.saveTeam));return}if(btn.dataset.uploadLogo!==undefined){$('logo-input-'+btn.dataset.uploadLogo)?.click();return}if(btn.dataset.removeLogo!==undefined){removeTeamLogo(Number(btn.dataset.removeLogo));return}let nav=btn.dataset.nav;if(nav){view=nav;notice='';render();return}if(btn.dataset.team!==undefined){selectedTeam=Number(btn.dataset.team);view='teams';render();return}if(btn.dataset.run){runN(Number(btn.dataset.run));return}if(btn.id==='stopbtn'){cancelRun=true;btn.disabled=true;btn.textContent='Stopping after this season…';return}if(btn.dataset.year){selectedSeason=Number(btn.dataset.year);view='history';render();return}if(btn.dataset.series){let [r,i]=btn.dataset.series.split('-').map(Number),target=$(`series-games-${r}-${i}`);if(!target)return;target.classList.toggle('hide');if(!target.classList.contains('hide')){get('seasons',selectedSeason).then(s=>getIndexAll('games','bySeason',selectedSeason).then(gs=>{let ids=new Set(s.rounds[r][i].gameIds),matches=gs.filter(g=>ids.has(g.id));target.innerHTML=table(['Game','Rolls','Bonus','Total','Decision','Winner'],matches.map(g=>`<tr><td>${g.gameNo}</td><td>${g.rollA}–${g.rollB}</td><td>+${g.bonusA}/+${g.bonusB}</td><td>${g.totalA}–${g.totalB}</td><td>${g.coin?'Coin flip':'Score'}</td><td>${esc(state.teams[g.winnerId].name)}</td></tr>`))}));}return}if(btn.id==='save-settings'){saveSettings();return}if(btn.id==='export'){exportBackup().catch(err=>setBanner('Export failed: '+err.message,true));return}if(btn.id==='import'){$('backup-input').click();return}if(btn.id==='reset'){resetAll();return}}
async function boot(){try{db=await openDB();let saved=await get('meta','main');state=saved?.value||initialState();if(!saved)await commitState();$('nav').addEventListener('click',handleClick);$('app').addEventListener('click',handleClick);$('app').addEventListener('change',e=>{if(e.target.dataset.logoInput!==undefined){const f=e.target.files?.[0];if(f)changeTeamLogo(Number(e.target.dataset.logoInput),f);e.target.value='';return}if(e.target.id==='season-select'){selectedSeason=Number(e.target.value);render()}if(e.target.id==='team-select'){selectedTeam=Number(e.target.value);render()}if(e.target.id==='player-sort'){playerSort=e.target.value;render()}});$('app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('th[data-sort]')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.dataset.teamName!==undefined){e.preventDefault();changeTeamName(Number(e.target.dataset.teamName))}});$('backup-input').addEventListener('change',e=>{let f=e.target.files[0];if(f)importBackup(f);e.target.value=''});await render()}catch(err){console.error(err);$('app').innerHTML=`<div class="notice warn">Unable to open local browser storage: ${esc(err.message)}. Try Chrome or Edge in a normal window, rather than private mode.</div>`}}
boot();
</script></body></html>

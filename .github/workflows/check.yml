name: Check Ice Numbers code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run simulation smoke tests
        run: node tests/smoke.test.mjs
      - name: Test atomic backup imports and streaming game history
        run: node tests/storage-maintenance.test.mjs
